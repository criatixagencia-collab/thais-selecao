function carregar(){const s=localStorage.getItem('thais_1920');if(s){const e=JSON.parse(s);p.forEach(x=>{if(e[x.n]){x.apr=e[x.n].a||false;x.im=e[x.n].i!==undefined?e[x.n].i:null}})}}
function sv(){const e={};p.forEach(x=>{e[x.n]={a:x.apr||false,i:x.im!==null?x.im:null}});localStorage.setItem('thais_1920',JSON.stringify(e));atualizar()}
function ta(n){const x=p.find(a=>a.n===n);x.apr=!x.apr;sv();render()}
function si(n,i){const x=p.find(a=>a.n===n);x.im=x.im===i?null:i;sv();render()}
function cp(n){navigator.clipboard.writeText(String(n));event.target.textContent='Copiado!';setTimeout(()=>event.target.textContent='Copiar',1500)}
function cr(){const a=p.filter(x=>x.apr);let t='Aprovadas:\n';a.forEach(x=>{t+='#'+x.n+' - '+x.tit+'\n';if(x.im!==null&&x.imgs[x.im]&&x.imgs[x.im].src)t+='  Img: '+x.imgs[x.im].label+'\n';t+='\n'});navigator.clipboard.writeText(t);event.target.textContent='Copiado!';setTimeout(()=>event.target.textContent='Copiar resumo',2000)}
function atualizar(){const t=p.length,a=p.filter(x=>x.apr).length;document.getElementById('resumoTopo').innerHTML='<span>'+t+'</span> pautas &middot; <span>'+a+'</span> aprovadas'+(a>0?' <button class="btn-cr" onclick="cr()">Copiar resumo</button>':'')}
function render(){const g=document.getElementById('grid');const cat=document.querySelector('.filtro.ativo')?.innerText?.toLowerCase()||'todas';const f=cat==='todas'?p:p.filter(x=>x.cat===cat)
g.innerHTML=f.map(x=>{const n=String(x.n).padStart(2,'0')
let ih=''
if(x.imgs.length===0){ih='<div class="pd">⚠️ Nenhuma imagem</div>'}else{ih=x.imgs.map((img,i)=>{if(!img.src)return'<div class="pd" onclick=\'si('+x.n+','+i+')\'>⚠️ '+img.label+' — '+img.credito+' ('+img.status+')</div>'
const sel=x.im===i?'sel':'';const sc=img.status.includes('segura')?'bg-s':'bg-c'
return'<div class=\'im '+sel+'\' onclick=\'si('+x.n+','+i+')\'><img src=\''+img.src+'\' alt=\''+img.label+'\'><div class=\'im-info\'><div class=\'lb\'>'+img.label+'</div><div class=\'cr\'>'+img.credito+'</div></div><span class=\'bd '+sc+'\'>'+img.status+'</span></div>'}).join('')}
let disp=x.imgs.filter(i=>i.src).length;let pend=x.imgs.filter(i=>!i.src).length
return'<div class=\'card '+(x.apr?'aprov':'')+'\'><div class=\'ch\'><div><span class=\'num\'>#'+n+'</span><button class=\'btn-cp\' onclick=\'cp('+x.n+')\'>Copiar</button></div><span class=\'est '+(x.apr?'ea':'ep')+'\'>'+(x.apr?'✅ Aprov':'⏳ Pend')+'</span></div><div class=\'cat\'>'+x.cl+'</div><h3>'+x.tit+'</h3><div class=\'res\'>'+x.resumo+'</div><div class=\'txt\'>'+x.texto+'</div><div class=\'ims\'><h4>🖼️ '+disp+' img(s) disponivel(is)'+(pend?' · '+pend+' pendente(s)':'')+'</h4>'+ih+'</div><div class=\'ac\'><button class=\'btn '+(x.apr?'apr':'')+'\' onclick=\'ta('+x.n+')\'>'+(x.apr?'✅ Aprov':'Aprovar')+'</button></div></div>'}).join('')
atualizar()}
carregar();render();function f(cat){document.querySelectorAll('.filtro').forEach(x=>x.classList.remove('ativo'));event.target.classList.add('ativo');render()}
