<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d0d0d;color:#e0e0e0;padding:20px}
.container{max-width:900px;margin:0 auto}
h1{font-size:1.6em;color:#fff;margin-bottom:4px}
.sub{color:#888;margin-bottom:4px;font-size:0.9em}
.resumo-topo{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:12px 16px;margin:16px 0;font-size:0.85em;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.resumo-topo span{color:#e50914;font-weight:700}
.btn-cr{background:#e50914;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.8em}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.filtro{background:#1a1a1a;border:1px solid #333;color:#aaa;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:0.8em;transition:all 0.2s}
.filtro.ativo,.filtro:hover{background:#e50914;border-color:#e50914;color:#fff}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:20px;margin-bottom:16px}
.card.aprovada{border-color:#4caf50;background:#1a2a1a}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.numero{background:#e50914;color:#fff;font-weight:700;font-size:0.85em;padding:4px 12px;border-radius:20px;display:inline-flex;align-items:center;gap:8px}
.btn-cp{background:transparent;border:1px solid #555;color:#aaa;padding:3px 10px;border-radius:4px;cursor:pointer;font-size:0.75em}
.btn-cp:hover{background:#333;color:#fff}
.cat{color:#888;font-size:0.75em;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
h3{color:#fff;font-size:1.1em;margin-bottom:6px}
.resumo-card{color:#ccc;font-size:0.85em;margin-bottom:10px;font-style:italic}
.texto{color:#aaa;font-size:0.85em;line-height:1.6;margin-bottom:12px;white-space:pre-line}
.imgs-section{border-top:1px solid #333;padding-top:12px;margin-bottom:12px}
.imgs-section h4{color:#888;font-size:0.8em;margin-bottom:8px}
.img-op{display:flex;align-items:flex-start;gap:12px;padding:10px;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;transition:all 0.2s}
.img-op:hover{background:#2a2a2a}
.img-op.sel{border-color:#e50914;background:#2a1a1a}
.img-op img{width:80px;height:80px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#333}
.img-info{flex:1}
.img-info .lbl{color:#ddd;font-size:0.8em}
.img-info .cred{color:#666;font-size:0.75em}
.badge{font-size:0.65em;padding:2px 6px;border-radius:4px;white-space:nowrap}
.bg-segura{background:#1a3a1a;color:#4caf4f}
.pendente-img{color:#ff5722;font-size:0.8em;padding:10px;border:1px dashed #ff5722;border-radius:6px;text-align:center}
.acoes{margin-top:12px}
.btn-ap{background:#4caf50;color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:0.85em;font-weight:600}
.btn-ap.aprovado{background:#333;color:#888;cursor:default}
.estado{padding:4px 10px;border-radius:4px;font-size:0.75em;font-weight:600}
.est-aprovada{background:#1a3a1a;color:#4caf50}
.est-pendente{background:#3a1a1a;color:#ff9800}
@media(max-width:600px){.img-op{flex-wrap:wrap}h1{font-size:1.3em}}
</style>

<script>
const pautas = [{"n": 1, "cat": "famosos", "cl": "Famosos / Internacional", "tit": "Anne Hathaway anuncia gravidez do terceiro filho", "resumo": "A atriz vencedora do Oscar esta esperando mais um filho com o marido Adam Shulman.", "texto": "A atriz Anne Hathaway, vencedora do Oscar por \"Os Miseraveis\" (2013) e conhecida por papeis em \"O Diabo Veste Prada\" e \"Alice no Pais das Maravilhas\", surpreendeu os fas ao anunciar que esta esperando seu terceiro filho. A noticia foi revelada por meio de um video nas redes sociais, onde a atriz aparece exibindo a barriguinha.\n\nHathaway, de 43 anos, ja e mae de Jonathan (2016) e Jack (2019), ambos frutos do casamento com o produtor e ator Adam Shulman. A atriz sempre foi reservada quanto a vida pessoal, mas frequentemente compartilha momentos em familia.\n\nA repercussao foi imediata: fas e celebridades enviaram mensagens de parabens. A gravidez de Hathaway era um dos assuntos mais comentados do momento nas redes sociais.", "imgs": [{"src": "imagens/01-anne-hathaway.jpg", "label": "Anne Hathaway em coletiva", "credito": "Wikimedia Commons", "status": "segura"}]}, {"n": 2, "cat": "tv", "cl": "TV / Famosos", "tit": "Erro ao vivo sobre morte de Jorge Messi leva a demissoes", "resumo": "Apresentadora argentina anunciou ao vivo que o pai de Messi havia morrido. Emissora demitiu toda a equipe.", "texto": "A apresentadora argentina Florencia Pena, do programa \"El Show del Verano\" (Luzu TV), anunciou ao vivo que Jorge Messi, pai do astro Lionel Messi, havia morrido. A familia desmentiu minutos depois. A emissora demitiu toda a equipe.\n\nFlorencia Pena pediu desculpas publicas e anunciou sua saida do canal. A Luzu TV emitiu nota oficial lamentando o incidente e reafirmando seu compromisso com o rigor jornalistico.\n\nO caso gerou ampla repercussao na Argentina e no mundo, reacendendo o debate sobre a responsabilidade jornalistica em tempos de informacao instantanea.", "imgs": [{"src": "imagens/02-lionel-messi.jpg", "label": "Lionel Messi na Casa Branca 2026", "credito": "Wikimedia Commons / White House", "status": "segura"}]}, {"n": 3, "cat": "famosos", "cl": "Famosos / Copa", "tit": "Karoline Lima surge em video de Leo Pereira e reforca reconciliacao na Copa", "resumo": "Ex do jogador aparece em video durante a Copa, reacendendo rumores de reconciliacao.", "texto": "Karoline Lima voltou a movimentar as redes ao aparecer em um video do jogador Leo Pereira durante a Copa de 2026. A aparicao foi suficiente para reacender rumores de reconciliacao do casal.\n\nNem Karoline nem Leo se pronunciaram oficialmente. A web ja esta a mil com comentarios, fas torcendo pela volta e outros desconfiados.\n\nLeo Pereira esta convocado para a Selecao na Copa. Karoline e mae de Cecilia, filha do relacionamento anterior dos dois.", "imgs": []}, {"n": 4, "cat": "famosos", "cl": "Famosos / Copa", "tit": "Luana Piovani volta a debochar de Neymar na Copa: 'Evitem'", "resumo": "'Evitem', disse a atriz, reacendendo rivalidade publica com o jogador.", "texto": "Luana Piovani voltou a alfinetar Neymar durante a Copa de 2026. Nas redes, fez postagens com tom de deboche, incluindo \"Evitem\". A fala reacendeu a antiga rivalidade publica.\n\nA repercussao foi imediata e dividiu opinioes entre quem apoia a critica e quem acha a provocacao desnecessaria em meio a Copa.\n\nNao e a primeira vez que a atriz se manifesta sobre Neymar. A nova polemica promete render burburinho.", "imgs": [{"src": "imagens/04-luana-piovani.jpg", "label": "Luana Piovani", "credito": "Wikimedia Commons", "status": "segura"}]}, {"n": 5, "cat": "famosos", "cl": "Famosos", "tit": "Virginia Fonseca: amigas fugiram de tiroteio em Nova York", "resumo": "'Ela sai de Caxias para NY para ter tiroteio. Loucura', disse Virginia.", "texto": "Virginia Fonseca ficou chocada ao saber que amigas estavam na Times Square durante um tiroteio em plena Copa. O incidente foi perto da 42nd Street.\n\nSegundo o NYPD, um suspeito foi preso, sem feridos. \"Sou de Caxias, nao vou saber o que e um tiro?\", disse uma amiga.\n\n\"Ela sai de Caxias para NY para ter tiroteio. Juro, ai e loucura\", disse Virginia nos stories.", "imgs": [{"src": "imagens/05-virginia-fonseca.jpg", "label": "Virginia Fonseca na CPI das Bets", "credito": "Wikimedia Commons", "status": "segura"}]}, {"n": 6, "cat": "famosos", "cl": "Famosos", "tit": "Juliette explica polemica sobre barrar marido de amiga no casamento", "resumo": "Conjuge cometeu violencia. 'Nao convidarei agressores para meu casamento'.", "texto": "Juliette Freire gerou polemica no \"Saia Justa\" (GNT) ao dizer que barraria o marido de uma amiga de ser madrinha. Esclareceu depois que o conjuge cometeu violencia contra a amiga.\n\nEla reconheceu que deveria ter sido explicita e usado a palavra \"violencia\" em vez de \"fez algo muito ruim\".\n\n\"O ponto central e violencia. Nao vou convidar um agressor para meu casamento\", afirmou Juliette, que se casa com Kaique Cerveny.", "imgs": [{"src": "imagens/06-juliette.jpg", "label": "Juliette no Web Summit Rio 2026", "credito": "Wikimedia Commons / Web Summit", "status": "segura"}]}, {"n": 7, "cat": "famosos", "cl": "Famosos / Copa", "tit": "Esposa de Gabriel Magalhaes desabafa sobre criticas ao jogador na Copa", "resumo": "Ela saiu em defesa do zagueiro da Selecao, pedindo mais respeito.", "texto": "A esposa do zagueiro Gabriel Magalhaes desabafou nas redes sobre as criticas ao jogador na Copa. Destacou o trabalho e sacrificio do atleta.\n\n\"As pessoas nao fazem ideia do que ele passa. Treina, se dedica, esta longe da familia, e ainda ouve tanta maldade\", escreveu.\n\nGabriel Magalhaes, do Arsenal, e peca importante na defesa da Selecao. O apoio da esposa mostrou o lado humano do atleta.", "imgs": [{"src": "imagens/07-gabriel-magalhaes.jpg", "label": "Gabriel Magalhaes 2026", "credito": "Wikimedia Commons", "status": "segura"}]}, {"n": 8, "cat": "famosos", "cl": "Famosos / Copa", "tit": "Modelo revela que foi desbloqueada por Vini Jr. apos polemica", "resumo": "Bruna Pinheiro percebeu desbloqueio apos estreia do jogador na Copa.", "texto": "Bruna Pinheiro revelou ter sido desbloqueada por Vini Jr. apos a estreia dele na Copa de 2026. Ela percebeu ao tentar acessar o perfil do jogador.\n\nNao houve contato direto, mas ela interpreta como sinal de que \"o assunto ficou para tras\".\n\nParalelamente, a jornalista Patricia Calderon afirmou que a relacao do casal e tratada como \"chacota\" nos bastidores do Real Madrid.", "imgs": [{"src": "imagens/08-vini-jr.jpg", "label": "Vini Jr. - Final Copa del Rey 2023", "credito": "Wikimedia Commons", "status": "segura"}]}, {"n": 9, "cat": "famosos", "cl": "Famosos", "tit": "Carlinhos Maia vira modelo do Chelsea e provoca reacoes", "resumo": "Influenciador foi escolhido pelo clube ingles para campanha.", "texto": "Carlinhos Maia foi escolhido como modelo do Chelsea FC para campanha oficial. Decisao dividiu opinioes entre torcedores.\n\nEnquanto alguns celebraram a parceria, outros questionaram a escolha. Carlinhos celebrou: \"Nunca imaginei que seria modelo de um time da Inglaterra\".", "imgs": [{"src": "imagens/09-carlinhos-maia.png", "label": "Carlinhos Maia", "credito": "Wikimedia Commons", "status": "segura"}]}, {"n": 10, "cat": "reality", "cl": "Reality", "tit": "Jordana do BBB 26 chora ao falar da vida pos-reality e irrita web", "resumo": "'Nem todo desabafo e reclamacao', disse a ex-sister ao rebater criticas.", "texto": "Jordana, ex-BBB 26, desabafou em lagrimas sobre a dificuldade pos-reality. \"Por que eu sou assim? Nao e facil\", disse.\n\nO choro gerou reacoes divididas. Parte criticou \"vitimismo\", outros a defenderam.\n\n\"Nem todo desabafo e reclamacao. As vezes e so uma pessoa sendo humana\", rebateu.", "imgs": []}, {"n": 11, "cat": "famosos", "cl": "Famosos / Musica", "tit": "Maria Bethania, aos 80, revela o que mais a atrai em homens e mulheres", "resumo": "Cantora baiana surpreendeu ao falar abertamente sobre o tema.", "texto": "Maria Bethania, um dos maiores nomes da MPB, concedeu entrevista aos 80 anos e falou sobre o que a atrai em homens e mulheres com naturalidade e bom humor.\n\nA declaracao repercutiu entre fas e admiradores. A cantora segue ativa, se apresentando e lancando trabalhos.\n\nAos 80, ela prova que continua dona de si e de suas opinioes.", "imgs": [{"src": "imagens/10-maria-bethania.jpg", "label": "Maria Bethania - Premio da Musica Brasileira", "credito": "Wikimedia Commons", "status": "segura"}]}, {"n": 12, "cat": "tv", "cl": "Novelas / TV", "tit": "Romulo Arantes Neto revela planos de ter filhos com esposa", "resumo": "Ator de Quem Ama Cuida falou sobre planos de familia.", "texto": "Romulo Arantes Neto, ator de \"Quem Ama Cuida\", revelou planos de ter filhos com a esposa. Falou sobre conciliar carreira e vida pessoal.\n\nA declaracao gerou curiosidade entre fas da novela. Romulo disse que o momento esta bem planejado.", "imgs": []}, {"n": 13, "cat": "tv", "cl": "Novelas / TV", "tit": "Miguel Falabella planeja voltar a escrever novelas apos 15 anos", "resumo": "Autor revelou no Roda Viva planos de retorno com roteiristas de Encantado's.", "texto": "Miguel Falabella (69) revelou no Roda Viva (TV Cultura) que planeja voltar a escrever novelas. Sua ultima trama foi \"Aquele Beijo\" (Globo, 2011).\n\nEsta desenvolvendo ideias com roteiristas de \"Encantado's\". A noticia animou fas do autor de \"Sai de Baixo\" e \"A Grande Familia\".", "imgs": [{"src": "imagens/13-miguel-falabella.jpg", "label": "Miguel Falabella", "credito": "Wikimedia Commons", "status": "segura"}]}, {"n": 14, "cat": "tv", "cl": "Novelas / TV", "tit": "Leticia Colin abre o jogo sobre vinganca em Quem Ama Cuida", "resumo": "Adriana sai da prisao apos 6 anos e planeja vinganca. 'Nao vai ser facil'.", "texto": "Leticia Colin revelou ao Extra os detalhes da 2a fase de \"Quem Ama Cuida\". Apos ser condenada injustamente a 12 anos, Adriana ganha liberdade e planeja vinganca.\n\n\"Nao vai ser facil\", adianta a atriz. A personagem precisa agir com estrategia, sob risco de voltar a prisao.\n\n\"Quem Ama Cuida\" e um dos grandes acertos da Globo em 2026.", "imgs": [{"src": "imagens/14-leticia-colin.jpg", "label": "Leticia Colin 2026", "credito": "Wikimedia Commons", "status": "segura"}]}, {"n": 15, "cat": "tv", "cl": "Novelas / TV", "tit": "Globo escala Ticiane Pinheiro para o elenco de Quem Ama Cuida", "resumo": "Apresentadora fara sua estreia como atriz em novelas.", "texto": "A Globo escalou Ticiane Pinheiro para \"Quem Ama Cuida\", marcando sua estreia como atriz em novelas.\n\nDetalhes da personagem ainda nao foram divulgados. Ticiane sempre demonstrou interesse em atuacao.\n\n\"Quem Ama Cuida\" e escrita por Thereza Falcao e tem direcao de Natalia Grimberg.", "imgs": [{"src": "imagens/15-ticiane-pinheiro.jpg", "label": "Ticiane Pinheiro 2013", "credito": "Wikimedia Commons / Gerardo Lazzari", "status": "segura"}]}, {"n": 16, "cat": "musica", "cl": "Musica", "tit": "Rock in Rio Lisboa 2026 estreia com brasileiros Alok, Pedro Sampaio e Sepultura", "resumo": "Ingressos do 1o fim de semana esgotados para o festival que comeca sabado.", "texto": "O Rock in Rio Lisboa estreia neste sabado (20/6). Ingressos do 1o fim de semana esgotados. Katy Perry e Linkin Park lideram.\n\nBrasileiros: Alok, Pedro Sampaio e Sepultura. No 2o fim de semana: Matue, Filipe Ret e Dennis. Havera Arena Musica e Futebol para a Copa.", "imgs": [{"src": "imagens/16-rock-in-rio.jpg", "label": "Rock in Rio - Madrid 2012", "credito": "Wikimedia Commons", "status": "segura"}]}, {"n": 17, "cat": "musica", "cl": "Musica", "tit": "Luan Santana e Wesley Safadao no Sao Joao de Caruaru", "resumo": "Wesley (sexta), Matheus & Kauan (sabado) e Luan (domingo) no Patio Luiz Gonzaga.", "texto": "O Maior Sao Joao do Mundo tem fim de semana historico em Caruaru. Wesley Safadao (sexta), Matheus & Kauan (sabado) e Luan Santana (domingo, 21h30).\n\nProgramacao inclui Taty Girl e Eric Land. O evento atrai milhares de turistas todos os anos.", "imgs": [{"src": "imagens/17-luan-santana.jpg", "label": "Luan Santana", "credito": "Wikimedia Commons", "status": "segura"}, {"src": "imagens/18-wesley-safadao.jpg", "label": "Wesley Safadao", "credito": "Wikimedia Commons", "status": "segura"}]}, {"n": 18, "cat": "musica", "cl": "Musica / Policia", "tit": "MC Negao Original, foragido, e investigado por golpe de R$ 100 milhoes", "resumo": "Foragido, funkeiro lancou musica no Top 20. Lei nao proibe lancamentos.", "texto": "MC Negao Original e alvo da Operacao Fim da Fabula, que investiga esquema de golpes digitais. Justica bloqueou R$ 100 milhoes em 86 contas.\n\nForagido, lancou \"Mini Saia\", que esta no Top 20. Especialista: lei nao proibe lancamentos de artistas sob investigacao.\n\n\"O dever de encontrar o suspeito e do Estado\", afirmou.", "imgs": []}];
function carregar(){const s=localStorage.getItem('thais_1730_final');if(s){const e=JSON.parse(s);pautas.forEach(p=>{if(e[p.n]){p.aprov=e[p.n].a||false;p.imgIdx=e[p.n].i!==undefined?e[p.n].i:null}})}}
function salvar(){const e={};pautas.forEach(p=>{e[p.n]={a:p.aprov||false,i:p.imgIdx!==null?p.imgIdx:null}});localStorage.setItem('thais_1730_final',JSON.stringify(e));atualizarResumo()}
function toggleAprovar(n){const p=pautas.find(x=>x.n===n);p.aprov=!p.aprov;salvar();render()}
function selImg(n,idx){const p=pautas.find(x=>x.n===n);p.imgIdx=p.imgIdx===idx?null:idx;salvar();render()}
function copiarNum(n){navigator.clipboard.writeText(String(n));event.target.textContent='Copiado!';setTimeout(()=>event.target.textContent='Copiar',1500)}
function copiarResumo(){const a=pautas.filter(p=>p.aprov);let t='Resumo aprovadas:\n';a.forEach(p=>{t+='#'+p.n+' - '+p.tit+'\n';if(p.imgIdx!==null&&p.imgs[p.imgIdx])t+='  Img: '+p.imgs[p.imgIdx].label+'\n';t+='\n'});navigator.clipboard.writeText(t);event.target.textContent='Copiado!';setTimeout(()=>event.target.textContent='Copiar resumo',2000)}
function atualizarResumo(){document.getElementById('resumoTopo').innerHTML='<span>'+pautas.length+'</span> pautas &middot; <span>'+pautas.filter(p=>p.aprov).length+'</span> aprovadas'+(pautas.filter(p=>p.aprov).length>0?' <button class="btn-cr" onclick="copiarResumo()">Copiar resumo</button>':'')}
function render(){const g=document.getElementById('grid');const cat=document.querySelector('.filtro.ativo')?.innerText?.toLowerCase()||'todas';const f=cat==='todas'?pautas:pautas.filter(p=>p.cat===cat)
g.innerHTML=f.map(p=>{const n=String(p.n).padStart(2,'0')
let imgsHtml
if(p.imgs.length===0){imgsHtml='<div class="pendente-img">⚠️ Pendente de imagem alternativa</div>'}else{imgsHtml=p.imgs.map((img,i)=>{if(!img.src)return'';const onerr="this.onerror=null;this.closest('.img-op').innerHTML='<div class=\'pendente-img\'>⚠️ Imagem nao carregou</div>'";return'<div class=\'img-op '+(p.imgIdx===i?'sel':'')+'\' onclick=\'selImg('+p.n+','+i+')\'><img src=\''+img.src+'\' alt=\''+img.label+'\' onerror=\''+onerr+'\'><div class=\'img-info\'><div class=\'lbl\'>'+img.label+'</div><div class=\'cred\'>'+img.credito+'</div></div><span class=\'badge bg-segura\'>'+img.status+'</span></div>'}).join('')}
return '<div class=\'card '+(p.aprov?'aprovada':'')+'\'><div class=\'ch\'><span class=\'numero\'>#'+n+' <button class=\'btn-cp\' onclick=\'copiarNum('+p.n+')\'>Copiar</button></span><span class=\'estado '+(p.aprov?'est-aprovada':'est-pendente')+'\'>'+(p.aprov?'✅ Aprovada':'⏳ Pendente')+'</span></div><div class=\'cat\'>'+p.cl+'</div><h3>'+p.tit+'</h3><div class=\'resumo-card\'>'+p.resumo+'</div><div class=\'texto\'>'+p.texto+'</div><div class=\'imgs-section\'><h4>🖼️ Imagens (clique para escolher)</h4>'+imgsHtml+'</div><div class=\'acoes\'><button class=\'btn-ap '+(p.aprov?'aprovado':'')+'\' onclick=\'toggleAprovar('+p.n+')\'>'+(p.aprov?'✅ Aprovada':'Aprovar materia')+'</button></div></div>'}).join('')
atualizarResumo()}
carregar();render();
function f(cat){document.querySelectorAll('.filtro').forEach(x=>x.classList.remove('ativo'));event.target.classList.add('ativo');render()}
</script>
</body>
</html>
