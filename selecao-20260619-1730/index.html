<script>
const pautas = [{"n": 1, "cat": "famosos", "cat_label": "Famosos / Internacional", "tit": "Anne Hathaway anuncia gravidez do terceiro filho", "resumo": "A atriz vencedora do Oscar esta esperando mais um filho com o marido Adam Shulman.", "texto": "A atriz Anne Hathaway, vencedora do Oscar de melhor atriz coadjuvante por \"Os Miseraveis\" (2013) e conhecida por papeis em \"O Diabo Veste Prada\" e \"Alice no Pais das Maravilhas\", surpreendeu os fas ao anunciar que esta esperando seu terceiro filho. A noticia foi revelada por meio de um video nas redes sociais, onde a atriz aparece exibindo a barriguinha e celebrando a novidade com seguidores ao redor do mundo.\n\nHathaway, de 43 anos, ja e mae de Jonathan, nascido em 2016, e Jack, nascido em 2019, ambos frutos do casamento com o produtor e ator Adam Shulman, com quem esta desde 2012. A atriz sempre foi reservada quanto a vida pessoal, mas frequentemente compartilha momentos em familia com os seguidores.\n\nA repercussao foi imediata: fas e celebridades enviaram mensagens de parabens, e a noticia rapidamente se espalhou pelos principais portais de entretenimento. A gravidez de Hathaway era um dos assuntos mais comentados do momento nas redes sociais, mostrando que a atriz continua sendo uma das figuras mais queridas de Hollywood.", "imgs": [{"src": "imagens/01-anne-hathaway.jpg", "label": "Anne Hathaway em coletiva de imprensa", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 2, "cat": "tv", "cat_label": "TV / Famosos", "tit": "Erro ao vivo sobre morte de Jorge Messi leva a demissoes e pedido de desculpas", "resumo": "Apresentadora argentina anunciou ao vivo que o pai de Messi havia morrido. Emissora demitiu toda a equipe.", "texto": "A apresentadora argentina Florencia Pena, do programa \"El Show del Verano\" exibido pela Luzu TV, cometeu um erro grave ao vivo ao anunciar que Jorge Messi, pai do astro Lionel Messi, havia morrido. A declaracao, feita em tom solene, foi imediatamente desmentida pela familia Messi, que informou que Jorge enfrenta problemas de saude mas esta em recuperacao hospitalar.\n\nA emissora nao hesitou em tomar medidas drasticas: toda a equipe responsavel pelo programa foi demitida. Florencia Pena, visivelmente abalada, pediu desculpas publicas e anunciou sua saida do canal. A Luzu TV emitiu uma nota oficial lamentando profundamente o incidente e reafirmando seu compromisso com o rigor jornalistico.\n\nO caso gerou ampla repercussao na Argentina e no mundo, especialmente por envolver a familia de Lionel Messi, um dos maiores nomes do esporte mundial. O erro ao vivo reacendeu o debate sobre a responsabilidade e a apuracao jornalistica em tempos de informacao instantanea.", "imgs": [{"src": "imagens/02-lionel-messi.jpg", "label": "Lionel Messi na Casa Branca 2026", "credito": "Wikimedia Commons / White House", "status": "segura para uso"}]}, {"n": 3, "cat": "famosos", "cat_label": "Famosos / Copa", "tit": "Karoline Lima surge em video de Leo Pereira e reforca rumores de reconciliacao na Copa", "resumo": "Ex do jogador aparece em video durante a Copa, reacendendo rumores.", "texto": "Karoline Lima voltou a movimentar as redes sociais ao aparecer rapidamente em um video publicado pelo jogador Leo Pereira durante a Copa do Mundo de 2026. A pequena aparicao, que mostra os dois no mesmo ambiente, foi suficiente para reacender os rumores de que o casal, que ja teve um relacionamento marcado por idas e vindas, pode estar se reconciliando.\n\nNem Karoline nem Leo se pronunciaram oficialmente sobre o assunto ate o momento. A web, no entanto, ja esta a mil: comentarios sobre o video se espalharam rapidamente, com fas torcendo pela reconciliacao e outros desconfiados da coincidencia em meio a Copa.\n\nO timing e sugestivo: Leo Pereira esta convocado para a Selecao Brasileira na Copa do Mundo, e Karoline e mae de Cecilia, fruto do relacionamento anterior dos dois. A presenca dela no circulo do jogador durante a competicao alimenta ainda mais as especulacoes sobre uma possivel volta.", "imgs": [{"src": "https://upload.wikimedia.org/wikipedia/commons/b/be/Karoline_Lima_2025.jpg", "label": "Karoline Lima", "credito": "Wikimedia Commons", "status": "usar com cautela"}]}, {"n": 4, "cat": "famosos", "cat_label": "Famosos / Copa", "tit": "Luana Piovani volta a debochar de Neymar durante a Copa: 'Evitem'", "resumo": "'Evitem', disse a atriz, reacendendo rivalidade publica com o jogador.", "texto": "Luana Piovani voltou a alfinetar Neymar durante a Copa do Mundo de 2026. Nas redes sociais, a atriz fez postagens com tom de deboche direcionadas ao jogador, incluindo a palavra \"Evitem\" em uma das mensagens. A fala reacendeu a antiga rivalidade publica entre os dois.\n\nA repercussao foi imediata e dividiu opinioes. De um lado, seguidores que apoiam a fala de Luana e concordam com a critica ao jogador. De outro, fas de Neymar que consideraram a provocacao desnecessaria, especialmente em meio a Copa do Mundo.\n\nEsta nao e a primeira vez que Luana Piovani se manifesta publicamente sobre Neymar. A atriz ja havia feito criticas ao jogador em outras oportunidades, sempre com o tom direto e sem filtro que a caracteriza. A nova polemica promete render burburinho pelas redes nos proximos dias.", "imgs": [{"src": "imagens/04-luana-piovani.jpg", "label": "Luana Piovani", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 5, "cat": "famosos", "cat_label": "Famosos", "tit": "Virginia Fonseca revela que amigas fugiram de tiroteio em Nova York: 'Loucura'", "resumo": "'Ela sai de Caxias para NY para ter tiroteio. Loucura', disse Virginia.", "texto": "Virginia Fonseca ficou chocada ao descobrir que suas amigas — que sao de Duque de Caxias (RJ) — estavam na Times Square, em Nova York, durante um tiroteio em plena Copa do Mundo. O incidente ocorreu perto da 42nd Street com a Broadway.\n\nSegundo o NYPD, um suspeito foi preso e uma arma foi apreendida, sem feridos confirmados. Uma das amigas de Virginia contou que correu sem saber para onde ir quando os tiros comecaram. \"Sou de Caxias, nao vou saber o que e um tiro?\", disse a outra, em tom ironico.\n\n\"Ela sai de Caxias para vir para Nova York para ter tiroteio. Juro, ai e loucura\", disparou Virginia ao relatar o ocorrido nos stories do Instagram. O desabafo bem-humorado repercutiu entre os seguidores, que se divertiram com a coincidencia azarada.", "imgs": [{"src": "imagens/05-virginia-fonseca.jpg", "label": "Virginia Fonseca na CPI das Bets", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 6, "cat": "famosos", "cat_label": "Famosos", "tit": "Juliette explica polemica sobre barrar marido de amiga no casamento: 'Era violencia'", "resumo": "Conjuge cometeu violencia contra a amiga. 'Nao convidarei agressores para meu casamento'.", "texto": "Juliette Freire gerou polemica no programa \"Saia Justa\" (GNT) ao dizer que barraria o marido de uma grande amiga de ser madrinha de seu casamento. A fala provocou uma onda de reacoes nas redes, com muitos interpretando a atitude como exagerada.\n\nNo dia seguinte, a cantora e ex-BBB usou os stories do Instagram para esclarecer: a fala foi \"no impulso\" e o cerne e que o conjuge cometeu violencia contra a amiga. Ela reconheceu que deveria ter sido mais explicita e usado a palavra \"violencia\".\n\n\"Na epoca, falei no impulso e nao fui especifica. Mas o ponto central e violencia. Nao vou convidar um agressor para meu casamento\", afirmou Juliette, que esta prestes a se casar com Kaique Cerveny. A cantora recebeu apoio de seguidores que elogiaram a posicao firme contra a violencia.", "imgs": [{"src": "imagens/06-juliette.jpg", "label": "Juliette no Web Summit Rio 2026", "credito": "Wikimedia Commons / Web Summit", "status": "segura para uso"}]}, {"n": 7, "cat": "famosos", "cat_label": "Famosos / Copa", "tit": "Esposa de Gabriel Magalhaes desabafa sobre criticas ao jogador durante a Copa", "resumo": "Ela saiu em defesa do zagueiro da Selecao, pedindo mais respeito.", "texto": "A esposa do zagueiro Gabriel Magalhaes, um dos convocados da Selecao para a Copa de 2026, desabafou nas redes sobre as criticas que o jogador vem recebendo. Em texto emocionado, destacou o trabalho e o sacrificio do atleta.\n\n\"As pessoas nao fazem ideia do que ele passa. Treina, se dedica, esta longe da familia, e ainda tem que ouvir tanta maldade\", escreveu. O desabafo gerou solidariedade de outros familiares de jogadores e torcedores.\n\nGabriel Magalhaes, que atua no Arsenal (ING), e peca importante na defesa da Selecao. As criticas questionavam atuacoes do jogador em partidas anteriores, mas o apoio da esposa mostrou o lado humano por tras do uniforme.", "imgs": [{"src": "imagens/07-gabriel-magalhaes.jpg", "label": "Gabriel Magalhaes 2026", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 8, "cat": "famosos", "cat_label": "Famosos / Copa", "tit": "Modelo revela que foi desbloqueada por Vini Jr. apos polemica com Virginia Fonseca", "resumo": "Bruna Pinheiro percebeu desbloqueio apos estreia do jogador na Copa: 'assunto ficou para tras'.", "texto": "Bruna Pinheiro, modelo apontada como pivô do fim do relacionamento de Virginia Fonseca e Vini Jr., revelou ter sido desbloqueada pelo jogador apos a estreia dele na Copa de 2026. Ela percebeu o desbloqueio ao tentar acessar o perfil de Vini Jr.\n\nSegundo Bruna, nao houve contato direto, mas ela interpreta o gesto como sinal de que \"o assunto ficou para tras\". A revelacao ocorre apos ela prometer expor os bastidores da polemica.\n\nParalelamente, a jornalista Patricia Calderon afirmou que a relacao do casal e tratada como \"chacota\" nos bastidores do Real Madrid. A historia promete novos capitulos.", "imgs": [{"src": "imagens/08-vini-jr.jpg", "label": "Vini Jr. - Final Copa del Rey 2023", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 9, "cat": "famosos", "cat_label": "Famosos", "tit": "Carlinhos Maia vira modelo do Chelsea e provoca reacoes nas redes", "resumo": "Influenciador foi escolhido pelo clube ingles para campanha e dividiu opinioes.", "texto": "O influenciador alagoano Carlinhos Maia foi escolhido como modelo do Chelsea Football Club para uma campanha oficial. A decisao do clube ingles gerou as mais variadas reacoes nas redes, dividindo opinioes entre torcedores e seguidores.\n\nEnquanto alguns celebraram a parceria como exemplo do poder dos creators brasileiros no exterior, outros questionaram a escolha. Carlinhos nao ligou para as criticas e celebrou a parceria.\n\n\"Never imaginei que seria modelo de um time la da Inglaterra\", brincou. A campanha ja esta no ar e promete render engajamento.", "imgs": [{"src": "imagens/09-carlinhos-maia.png", "label": "Carlinhos Maia", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 10, "cat": "famosos", "cat_label": "Famosos / Musica", "tit": "Maria Bethania, aos 80 anos, revela o que mais a atrai em homens e mulheres", "resumo": "Cantora baiana surpreendeu ao falar abertamente sobre o tema em entrevista.", "texto": "Maria Bethania, um dos maiores nomes da musica brasileira e irma de Caetano Veloso, concedeu entrevista reveladora aos 80 anos e falou abertamente sobre o que mais a atrai em homens e mulheres. A cantora baiana surpreendeu ao abordar o tema com naturalidade e bom humor.\n\nBethania refletiu sobre afeto, beleza e conexao, sem se prender a generos ou convencoes sociais. A declaracao repercutiu entre fas e admiradores, e a cantora segue ativa na musica, se apresentando e lancando trabalhos.\n\nA entrevista faz parte das comemoracoes pelos 80 anos da cantora, uma das vozes mais emblematicas da MPB, com hits como \"Explode Coracao\" e \"O Meu Amor\". Aos 80, ela prova que continua dona de si.", "imgs": [{"src": "https://upload.wikimedia.org/wikipedia/commons/a/a2/26_Pr%C3%AAmio_da_M%C3%BAsica_Brasileira_%2818072631074%29.jpg", "label": "Maria Bethania - Premio da Musica Brasileira", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 11, "cat": "tv", "cat_label": "Novelas / TV", "tit": "Miguel Falabella revela planos para voltar a escrever novelas apos 15 anos de hiato", "resumo": "Autor revelou no Roda Viva planos de retorno com roteiristas de Encantado's.", "texto": "Miguel Falabella, de 69 anos, revelou no programa Roda Viva (TV Cultura) que planeja voltar a escrever novelas apos 15 anos de hiato. Sua ultima trama foi \"Aquele Beijo\" (Globo, 2011).\n\nO artista disse que desenvolve novas ideias com as roteiristas Thais Pontes e Renatinha Linhares, autoras de \"Encantado's\". Falabella afirmou que sente saudade do processo criativo e que o momento e propicio para o retorno.\n\nA noticia animou os fas do autor de \"Sai de Baixo\" e \"A Grande Familia\". A declaracao acontece um ano apos seu retorno as novelas como ator em \"Tres Gracas\" (2025).", "imgs": [{"src": "imagens/13-miguel-falabella.jpg", "label": "Miguel Falabella", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 12, "cat": "tv", "cat_label": "Novelas / TV", "tit": "Leticia Colin abre o jogo sobre vinganca na nova fase de Quem Ama Cuida", "resumo": "Adriana sai da prisao apos 6 anos e planeja vinganca. 'Nao vai ser facil'.", "texto": "Leticia Colin, interprete da protagonista Adriana em \"Quem Ama Cuida\" (Globo), revelou em entrevista ao Extra os detalhes da segunda fase. Apos ser condenada injustamente a 12 anos, Adriana ganha liberdade condicional e arquiteta um plano de vinganca.\n\nColin adianta que a missao nao sera facil: a personagem precisa agir com frieza e estrategia, sob o risco de ter a liberdade cassada. \"Ela sai determinada, mas tambem fragil\", explicou.\n\nA nova fase promete reviravoltas e emocoes. \"Quem Ama Cuida\" tem conquistado bons indices de audiencia e se consolidado como um dos grandes acertos da Globo em 2026.", "imgs": [{"src": "imagens/14-leticia-colin.jpg", "label": "Leticia Colin 2026", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 13, "cat": "tv", "cat_label": "Novelas / TV", "tit": "Globo escala Ticiane Pinheiro para o elenco de Quem Ama Cuida", "resumo": "Apresentadora fara sua estreia como atriz em novelas na trama das seis.", "texto": "A Globo escalou a apresentadora Ticiane Pinheiro para o elenco de \"Quem Ama Cuida\". A entrada marca sua estreia como atriz em novelas, passo importante em sua carreira.\n\nAinda nao foram divulgados detalhes sobre a personagem que Ticiane interpretara nem em que fase entrara. A expectativa e grande: a apresentadora tem legiao de seguidores e sua estreia como atriz atraira atencao.\n\nTiciane sempre demonstrou interesse em atuacao. \"Quem Ama Cuida\" pode ser o comeco de uma nova fase em sua carreira.", "imgs": [{"src": "imagens/15-ticiane-pinheiro.jpg", "label": "Ticiane Pinheiro 2013", "credito": "Wikimedia Commons / Gerardo Lazzari", "status": "segura para uso"}]}, {"n": 14, "cat": "musica", "cat_label": "Musica", "tit": "Rock in Rio Lisboa 2026 estreia com brasileiros Alok, Pedro Sampaio e Sepultura", "resumo": "Ingressos do 1o fim de semana esgotados para o festival que comeca sabado.", "texto": "A 11a edicao do Rock in Rio Lisboa estreia neste sabado (20/6) no Parque Tejo. Ingressos para o primeiro fim de semana estao esgotados. Katy Perry, Linkin Park e Charlie Puth lideram os primeiros dias.\n\nBrasileiros na programacao: Alok (Palco Music Valley), Pedro Sampaio (Palco Mundo) e Sepultura (Palco Music Valley). O festival tambem tera Matue, Filipe Ret e Dennis no segundo fim de semana.\n\nUma Arena Musica e Futebol sera montada para transmissao dos jogos da Copa. Para brasileiros em Portugal, a programacao diversificada promete atender a todos os gostos.", "imgs": [{"src": "https://upload.wikimedia.org/wikipedia/commons/b/b4/Rock_in_Rio_-_Madrid_2012.jpg", "label": "Rock in Rio - arquivo", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 15, "cat": "musica", "cat_label": "Musica", "tit": "Luan Santana e Wesley Safadao agitam o Sao Joao de Caruaru neste fim de semana", "resumo": "Fim de semana historico: Wesley (sexta), Matheus & Kauan (sabado) e Luan (domingo).", "texto": "O Maior e Melhor Sao Joao do Mundo promete fim de semana historico em Caruaru (PE). Na sexta (19), Wesley Safadao as 23h30 com telao do jogo da Selecao. No sabado (20), Matheus & Kauan. No domingo (21), Luan Santana as 21h30.\n\nA programacao inclui Taty Girl, Eric Land e atracoes nos polos do Alto do Moura e Aculao. O Sao Joao de Caruaru atrai milhares de turistas todos os anos.\n\nA combinacao de grandes shows com atmosfera tipica do Nordeste faz do Patio Luiz Gonzaga o lugar certo para celebrar o Sao Joao com musica de qualidade.", "imgs": [{"src": "https://upload.wikimedia.org/wikipedia/commons/7/76/2Z9A7852.jpg", "label": "Luan Santana", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 16, "cat": "musica", "cat_label": "Musica / Policia", "tit": "MC Negao Original, foragido, e investigado por golpe de R$ 100 milhoes", "resumo": "Foragido, funkeiro lancou musica no Top 20. Lei nao proibe lancamentos.", "texto": "O funkeiro MC Negao Original, nome artistico de Joao Vitor Ribeiro, e alvo da Operacao Fim da Fabula, da Policia Civil de SP e MP. A investigacao apura organizacao criminosa especializada em golpes digitais que teria movimentado valores milionarios.\n\nA Justica bloqueou ate R$ 100 milhoes em 86 contas. Foragido, o MC lancou \"Mini Saia\", que ja esta no Top 20 das plataformas. Especialista ouvido pelo G1 explica que a lei nao proibe lancamentos de artistas sob investigacao.\n\n\"O dever de encontrar o suspeito e do Estado\", afirmou. O caso mescla musica e crime e tem gerado debates acalorados nas redes.", "imgs": [{"src": "https://upload.wikimedia.org/wikipedia/commons/e/e3/Wesley_Safad%C3%A3o_Citibank_Hall_2017_%2836674588052%29_%28cropped%29.jpg", "label": "Wesley Safadao", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 17, "cat": "famosos", "cat_label": "Novelas / TV", "tit": "Ro function carregar(){const s=localStorage.getItem('thais_20260619_1730');if(s){const e=JSON.parse(s);pautas.forEach(p=>{if(e[p.n]){p.aprovada=e[p.n].a||false;p.imgSel=e[p.n].i!==undefined?e[p.n].i:null}})}}
function salvar(){const e={};pautas.forEach(p=>{e[p.n]={a:p.aprovada||false,i:p.imgSel!==null?p.imgSel:null}});localStorage.setItem('thais_20260619_1730',JSON.stringify(e));atualizarResumo()}
function toggleAprovar(n){const p=pautas.find(x=>x.n===n);p.aprovada=!p.aprovada;salvar();render(document.querySelector('.filtro.ativo')?.innerText?.toLowerCase()||'todas')}
function selImg(n,idx){const p=pautas.find(x=>x.n===n);p.imgSel=p.imgSel===idx?null:idx;salvar();render(document.querySelector('.filtro.ativo')?.innerText?.toLowerCase()||'todas')}
function copiarNum(n){navigator.clipboard.writeText(String(n));event.target.textContent='Copiado!';setTimeout(()=>event.target.textContent='Copiar',1500)}
function copiarResumo(){const a=pautas.filter(p=>p.aprovada);let t='Resumo aprovadas:\n';a.forEach(p=>{t+='#'+p.n+' - '+p.tit+'\n';if(p.imgSel!==null&&p.imgs[p.imgSel]){const img=p.imgs[p.imgSel];t+='  Imagem: '+img.label+' | '+img.credito+'\n'}t+='\n'});navigator.clipboard.writeText(t);event.target.textContent='Copiado!';setTimeout(()=>event.target.textContent='Copiar resumo',2000)}
function atualizarResumo(){const t=pautas.length,a=pautas.filter(p=>p.aprovada).length;document.getElementById('resumoTopo').innerHTML='<span class="num">'+t+'</span> pautas &middot; <span class="num">'+a+'</span> aprovadas'+(a>0?' <button class="btn-copiar-resumo" onclick="copiarResumo()">Copiar resumo</button>':'')}
function render(cat){const g=document.getElementById('grid');const f=cat==='todas'?pautas:pautas.filter(p=>p.cat===cat)
g.innerHTML=f.map(p=>{const n=String(p.n).padStart(2,'0')
const imgsHtml=p.imgs.map((img,i)=>{if(!img.src)return '<div class="img-pendente-note">⚠️ '+img.label+' — '+img.credito+'</div>'
const sel=p.imgSel===i?'selecionada':'';const sc=img.status.includes('segura')?'status-segura':img.status.includes('cautela')?'status-cautela':'status-pendente'
const onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\'img-pendente-note\'>⚠️ Imagem nao carregou — '+this.alt+'</div>'"
return '<div class=\'img-opcao '+sel+'\' onclick=\'selImg('+p.n+','+i+')\'><img src=\''+img.src+'\' alt=\''+img.label+'\' onerror=\''+onerror+'\'><div class=\'img-info\'><div class=\'label\'>'+img.label+'</div><div class=\'credito\'>'+img.credito+'</div></div><span class=\'status-badge '+sc+'\'>'+img.status+'</span></div>'}).join('')
return '<div class=\'card '+(p.aprovada?'aprovada':'')+'\'><div class=\'card-header\'><span class=\'numero\'>#'+n+' <button class=\'btn-copiar\' onclick=\'copiarNum('+p.n+')\'>Copiar</button></span><span class=\'estado '+(p.aprovada?'estado-aprovada':'estado-pendente')+'\'>'+(p.aprovada?'✅ Aprovada':'⏳ Pendente')+'</span></div><div class=\'categoria\'>'+p.cat_label+'</div><h3>'+p.tit+'</h3><div class=\'resumo-card\'>'+p.resumo+'</div><div class=\'texto-completo\'>'+p.texto+'</div><div class=\'imgs-section\'><h4>🖼️ Imagens (clique para escolher)</h4>'+imgsHtml+'</div><div class=\'acoes\'><button class=\'btn-aprovar '+(p.aprovada?'aprovado':'')+'\' onclick=\'toggleAprovar('+p.n+')\'>'+(p.aprovada?'✅ Aprovada':'Aprovar materia')+'</button></div></div>'}).join('')
atualizarResumo()}
function filtrar(cat){document.querySelectorAll('.filtro').forEach(f=>f.classList.remove('ativo'));event.target.classList.add('ativo');render(cat)}
carregar();render('todas');
</script>
