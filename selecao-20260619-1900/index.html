<script>
const p = [{"n": 1, "cat": "famosos", "cl": "Famosos", "tit": "Nana Gouvea fala sobre affair com Romario e diz que se sentiu exposta", "resumo": "Atriz confirmou relacionamento com ex-jogador, mas criticou exposicao publica.", "texto": "Nana Gouvea comentou publicamente os rumores sobre um suposto relacionamento com o ex-jogador de futebol Romario. Em entrevista a Quem, a atriz confirmou que viveu um affair recente, mas afirmou que se sentiu desconfortavel com a exposicao do caso, que ganhou forca apos registros dos dois juntos em Nova York.\n\nSegundo Nana, ela e Romario ja se conhecem ha muitos anos, mas nunca haviam tido qualquer envolvimento amoroso no passado. \"Eu conheco o Romario ha decadas, nunca tive nada com ele\", disse. Ao comentar o episodio mais recente, ela confirmou o relacionamento e relatou incomodo com a forma como a situacao veio a tona.\n\n\"Me senti desrespeitada porque ele estava saindo comigo e outra pessoa ao mesmo tempo. E ele me expos\", declarou. O caso ganhou atencao apos fotos e videos circularem mostrando encontros do ex-jogador em Nova York, onde ele esta para a Copa do Mundo 2026.\n\nMorando nos EUA, Nana reforcou: \"Minha vida esta tao em paz. Acho que isso nao me acrescenta enquanto profissional. Me desmerece como mulher, mae de familia e profissional\".", "imgs": [{"src": "https://upload.wikimedia.org/wikipedia/commons/9/9d/Rom%C3%A1rio_2022_CROPPED.jpg", "label": "Romario (foto de arquivo)", "credito": "Wikimedia Commons", "status": "usar com cautela"}, {"src": "", "label": "Nana Gouvea (Instagram)", "credito": "Reproducao/Instagram", "status": "Verificar via Apify"}]}, {"n": 2, "cat": "famosos", "cl": "Famosos", "tit": "Ex-Ronaldinha revela bastidores de namoro com Ronaldo Fenomeno", "resumo": "Vivi Brunieri contou em podcast que segredo sobre sua origem levou ao fim do relacionamento.", "texto": "Vivi Brunieri, conhecida como ex-Ronaldinha, abriu o jogo sobre o antigo relacionamento com Ronaldo Nazario. Em entrevista ao podcast Na Mesa, ela relembrou o periodo em que os dois namoraram no inicio da carreira do atleta e explicou como o romance chegou ao fim.\n\nSegundo Vivi, o relacionamento comecou em meio ao auge da fama do jogador, quando ela ainda escondia que trabalhava como garota de programa. Durante o namoro, mantinha uma narrativa diferente sobre sua origem financeira, o que gerou tensao quando a verdade veio a tona.\n\n\"Eu, sufocada com aquilo, fiquei bebada. E falei: Ronaldo, eu nao aguento mais. Eu nao tenho padrasto rico\", relembrou. \"Ele chorou muito, se sentiu traido. E ali terminou\", disse.\n\nAtualmente missionaria evangelica, Vivi revisita o periodo com outro olhar, reconhecendo os conflitos e consequencias emocionais profundas da epoca.", "imgs": [{"src": "", "label": "Vivi Brunieri (ex-Ronaldinha)", "credito": "Reproducao/Instagram", "status": "Verificar via Apify"}, {"src": "", "label": "Ronaldo Fenomeno (arquivo)", "credito": "Getty Images", "status": "pendente de imagem"}]}, {"n": 3, "cat": "famosos", "cl": "Famosos / Internacional", "tit": "Anne Hathaway anuncia gravidez do terceiro filho", "resumo": "Atriz vencedora do Oscar esta esperando mais um filho com o marido Adam Shulman.", "texto": "A atriz Anne Hathaway, vencedora do Oscar por \"Os Miseraveis\" (2013) e conhecida por \"O Diabo Veste Prada\", surpreendeu os fas ao anunciar que esta esperando seu terceiro filho. A noticia foi revelada em video nas redes sociais.\n\nHathaway, de 43 anos, ja e mae de Jonathan (2016) e Jack (2019), ambos do casamento com o produtor Adam Shulman. A atriz sempre foi reservada sobre a vida pessoal.\n\nA repercussao foi imediata: fas e celebridades enviaram parabens, e a noticia se espalhou pelos portais de entretenimento. Anne segue sendo uma das figuras mais queridas de Hollywood.", "imgs": [{"src": "imagens/03-anne-hathaway.jpg", "label": "Anne Hathaway em coletiva de imprensa", "credito": "Wikimedia Commons", "status": "segura para uso"}, {"src": "https://upload.wikimedia.org/wikipedia/commons/d/da/Anne_Hathaway-_Press_conference_for_the_film_%22The_Devil_Wears_Prada_2%22_-_55194764955_%28cropped%29.jpg", "label": "Anne Hathaway (alternativa)", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 4, "cat": "tv", "cl": "TV / Famosos", "tit": "Erro ao vivo sobre morte de Jorge Messi leva a demissoes", "resumo": "Apresentadora anunciou ao vivo que o pai de Messi havia morrido. Emissora demitiu toda a equipe.", "texto": "A apresentadora argentina Florencia Pena, do \"El Show del Verano\" (Luzu TV), anunciou ao vivo que Jorge Messi, pai de Lionel Messi, havia morrido. A familia desmentiu minutos depois.\n\nA emissora demitiu toda a equipe. Florencia Pena pediu desculpas publicas e anunciou saida do canal. A Luzu TV emitiu nota reafirmando compromisso com o rigor jornalistico.\n\nO caso reacendeu o debate sobre responsabilidade jornalistica em tempos de informacao instantanea.", "imgs": [{"src": "imagens/04-lionel-messi.jpg", "label": "Lionel Messi na Casa Branca 2026", "credito": "Wikimedia Commons", "status": "segura para uso"}, {"src": "https://upload.wikimedia.org/wikipedia/commons/6/6b/Lionel_Messi_White_House_2026_%283x4_cropped%29.jpg", "label": "Messi (alternativa)", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 5, "cat": "tv", "cl": "TV Internacional", "tit": "James Burrows, diretor de Taxi, Frasier e Will & Grace, morre", "resumo": "Diretor premiado da televisao americana deixa legado de sucessos da comedia.", "texto": "James Burrows, um dos diretores mais premiados da TV americana, morreu. Ele dirigiu marcos como \"Taxi\", \"Frasier\" e \"Will & Grace\", definindo a comedia televisiva dos anos 80, 90 e 2000.\n\nBurrows acumulou premios Emmy e foi reconhecido por sitcoms que marcaram geracoes. \"Frasier\" e considerada uma das melhores comedias da historia da TV.\n\n\"Will & Grace\" tambem levou sua assinatura e foi pioneira na representacao LGBTQIA+. James Burrows deixa um legado imenso para a comedia mundial.", "imgs": [{"src": "", "label": "James Burrows (foto de arquivo)", "credito": "Getty Images/Emmys", "status": "pendente de imagem"}]}, {"n": 6, "cat": "musica", "cl": "Musica", "tit": "Tropa do Bruxo: disco reune MC Tuto, MC Rodrigo do CN, MC Jacare e Hariel", "resumo": "Projeto une musica, futebol e o cotidiano das periferias brasileiras.", "texto": "A Tropa do Bruxo lancou um disco que busca unir musica, futebol e o cotidiano das periferias brasileiras. O album tem participacoes de MC Tuto, MC Rodrigo do CN, MC Jacare e Hariel.\n\nO projeto ja esta gerando repercusao nas plataformas de streaming. A uniao de varios nomes do funk em um mesmo trabalho e vista como fortalecimento do genero.\n\nA Tropa do Bruxo se propoe a conectar o universo do futebol de base com a musica feita nas quebradas.", "imgs": [{"src": "", "label": "MC Hariel (show)", "credito": "Reproducao/Divulgacao", "status": "pendente de imagem"}, {"src": "", "label": "Arte do disco Tropa do Bruxo", "credito": "Divulgacao", "status": "pendente de imagem"}]}, {"n": 7, "cat": "musica", "cl": "Musica", "tit": "Rock in Rio Lisboa 2026 estreia com brasileiros Alok, Pedro Sampaio e Sepultura", "resumo": "Ingressos do 1o fim de semana esgotados. Festival comeca neste sabado (20/6).", "texto": "O Rock in Rio Lisboa estreia neste sabado (20/6) no Parque Tejo. Ingressos do primeiro fim de semana esgotados. Katy Perry, Linkin Park, Cypress Hill e Charlie Puth lideram.\n\nBrasileiros na programacao: Alok (Palco Music Valley), Pedro Sampaio (Palco Mundo) e Sepultura (Palco Music Valley). O festival tem Matue, Filipe Ret e Dennis no 2o fim de semana.\n\nUma Arena Musica e Futebol sera montada para a transmissao dos jogos da Copa. Para brasileiros em Portugal, a programacao promete atender a todos os gostos.", "imgs": [{"src": "imagens/07-rock-in-rio.jpg", "label": "Rock in Rio - arquivo", "credito": "Wikimedia Commons", "status": "segura para uso"}, {"src": "", "label": "Alok (divulgacao)", "credito": "Divulgacao", "status": "pendente de imagem"}]}, {"n": 8, "cat": "musica", "cl": "Musica", "tit": "Luan Santana e Wesley Safadao no Sao Joao de Caruaru", "resumo": "Wesley (sexta), Matheus & Kauan (sabado) e Luan (domingo) no Patio Luiz Gonzaga.", "texto": "O Maior Sao Joao do Mundo promete fim de semana historico em Caruaru (PE). Wesley Safadao (sexta, 23h30), Matheus & Kauan (sabado) e Luan Santana (domingo, 21h30).\n\nA programacao inclui Taty Girl e Eric Land. O Sao Joao de Caruaru atrai milhares de turistas todos os anos.\n\nA combinacao de grandes shows com atmosfera nordestina faz do Patio Luiz Gonzaga o lugar certo para celebrar o Sao Joao.", "imgs": [{"src": "imagens/08a-luan-santana.jpg", "label": "Luan Santana", "credito": "Wikimedia Commons", "status": "segura para uso"}, {"src": "imagens/08b-wesley-safadao.jpg", "label": "Wesley Safadao", "credito": "Wikimedia Commons", "status": "segura para uso"}]}, {"n": 9, "cat": "musica", "cl": "Musica / Policia", "tit": "MC Negao Original, foragido, e investigado por golpe de R$ 100 milhoes", "resumo": "Foragido, funkeiro lancou musica no Top 20. Lei nao proibe lancamentos de artistas sob investigacao.", "texto": "MC Negao Original (Joao Vitor Ribeiro) e alvo da Operacao Fim da Fabula, da Policia Civil de SP e MP. A operacao investiga organizacao de golpes digitais — \"golpe do falso advogado\" e golpe do INSS.\n\nA Justica bloqueou ate R$ 100 milhoes em 86 contas. Foragido, lancou \"Mini Saia\", que esta no Top 20. Especialista: lei nao proibe lancamentos de artistas investigados.\n\n\"O dever de encontrar o suspeito e do Estado\", afirmou. O caso mescla musica e crime e tem gerado debates.", "imgs": [{"src": "", "label": "MC Negao Original (Instagram)", "credito": "Reproducao/Instagram", "status": "Verificar via Apify"}, {"src": "", "label": "Operacao policial", "credito": "Policia Civil/SP", "status": "pendente de imagem"}]}, {"n": 10, "cat": "famosos", "cl": "Famosos / Copa", "tit": "Karoline Lima surge em video de Leo Pereira e reforca reconciliacao na Copa", "resumo": "Ex do jogador aparece em video durante a Copa, reacendendo rumores de volta.", "texto": "Karoline Lima voltou a movimentar as redes ao aparecer em video do jogador Leo Pereira durante a Copa de 2026. A aparicao reacendeu rumores de reconciliacao.\n\nNem Karoline nem Leo se pronunciaram. A web ja esta especulando. Leo esta convocado para a Selecao e Karoline e mae de Cecilia, filha do ex-casal.", "imgs": [{"src": "imagens/10-leo-pereira.jpg", "label": "Leo Pereira 2025", "credito": "Wikimedia Commons", "status": "segura para uso"}, {"src": "", "label": "Karoline Lima (Instagram)", "credito": "Reproducao/Instagram", "status": "Verificar via Apify"}]}, {"n": 11, "cat": "famosos", "cl": "Famosos / Musica", "tit": "Maria Bethania, aos 80 anos, revela o que mais a atrai em homens e mulheres", "resumo": "Cantora baiana surpreendeu ao falar abertamente sobre o tema em entrevista.", "texto": "Maria Bethania, um dos maiores nomes da MPB e irma de Caetano Veloso, concedeu entrevista aos 80 anos e falou sobre o que a atrai em homens e mulheres com naturalidade e bom humor.\n\nBethania refletiu sobre afeto e conexao sem se prender a generos. A declaracao repercutiu entre fas. A cantora segue ativa na musica, com hits como \"Explode Coracao\" e \"O Meu Amor\".\n\nA entrevista faz parte das comemoracoes pelos 80 anos da cantora, que prova que continua dona de si e de suas opinioes.", "imgs": [{"src": "imagens/11-maria-bethania.jpg", "label": "Maria Bethania - Premio da Musica Brasileira", "credito": "Wikimedia Commons", "status": "segura para uso"}, {"src": "https://upload.wikimedia.org/wikipedia/commons/a/a2/26_Pr%C3%AAmio_da_M%C3%BAsica_Brasileira_%2818072631074%29.jpg", "label": "MB no Premio da Musica (alternativa)", "credito": "Wikimedia Commons", "status": "segura para uso"}]}];
function carregar(){const s=localStorage.getItem('thais_1900');if(s){const e=JSON.parse(s);p.forEach(x=>{if(e[x.n]){x.apr=e[x.n].a||false;x.im=e[x.n].i!==undefined?e[x.n].i:null}})}}
function sv(){const e={};p.forEach(x=>{e[x.n]={a:x.apr||false,i:x.im!==null?x.im:null}});localStorage.setItem('thais_1900',JSON.stringify(e));atualizar()}
function ta(n){const x=p.find(a=>a.n===n);x.apr=!x.apr;sv();render()}
function si(n,i){const x=p.find(a=>a.n===n);x.im=x.im===i?null:i;sv();render()}
function cp(n){navigator.clipboard.writeText(String(n));event.target.textContent='Copiado!';setTimeout(()=>event.target.textContent='Copiar',1500)}
function cr(){const a=p.filter(x=>x.apr);let t='Aprovadas:\n';a.forEach(x=>{t+='#'+x.n+' - '+x.tit+'\n';if(x.im!==null&&x.imgs[x.im])t+='  Img: '+x.imgs[x.im].label+' | '+x.imgs[x.im].credito+'\n';t+='\n'});navigator.clipboard.writeText(t);event.target.textContent='Copiado!';setTimeout(()=>event.target.textContent='Copiar resumo',2000)}
function atualizar(){const t=p.length,a=p.filter(x=>x.apr).length;document.getElementById('resumoTopo').innerHTML='<span>'+t+'</span> pautas &middot; <span>'+a+'</span> aprovadas'+(a>0?' <button class="btn-cr" onclick="cr()">Copiar resumo</button>':'')}
function render(){const g=document.getElementById('grid');const cat=document.querySelector('.filtro.ativo')?.innerText?.toLowerCase()||'todas';const f=cat==='todas'?p:p.filter(x=>x.cat===cat)
g.innerHTML=f.map(x=>{const n=String(x.n).padStart(2,'0')
let ih=''
if(x.imgs.length===0){ih='<div class="pd">⚠️ Nenhuma imagem candidata</div>'}else{ih=x.imgs.map((img,i)=>{if(!img.src)return'<div class="pd" onclick=\'si('+x.n+','+i+')\'>⚠️ '+img.label+' — '+img.credito+' ('+img.status+')</div>'
const sel=x.im===i?'sel':'';const sc=img.status.includes('segura')?'bg-s':img.status.includes('cautela')?'bg-c':'bg-p'
const onerr="this.onerror=null;this.closest('.im').innerHTML='<div class=\'pd\'>⚠️ Falha ao carregar</div>'"
return'<div class=\'im '+sel+'\' onclick=\'si('+x.n+','+i+')\'><img src=\''+img.src+'\' alt=\''+img.label+'\' onerror=\''+onerr+'\'><div class=\'im-info\'><div class=\'lb\'>'+img.label+'</div><div class=\'cr\'>'+img.credito+'</div></div><span class=\'bd '+sc+'\'>'+img.status+'</span></div>'}).join('')}
let imgCount = x.imgs.filter(i=>i.src).length
let pendCount = x.imgs.filter(i=>!i.src).length
let imgLabel = '🖼️ ' + imgCount + ' imagem(ns) disponivel(is)'
if(pendCount>0) imgLabel += ' · ' + pendCount + ' pendente(s) (Instagram via Apify)'
return'<div class=\'card '+(x.apr?'aprov':'')+'\'><div class=\'ch\'><div><span class=\'num\'>#'+n+'</span> <button class=\'btn-cp\' onclick=\'cp('+x.n+')\'>Copiar</button></div><span class=\'est '+(x.apr?'ea':'ep')+'\'>'+(x.apr?'✅ Aprovada':'⏳ Pendente')+'</span></div><div class=\'cat\'>'+x.cl+'</div><h3>'+x.tit+'</h3><div class=\'res\'>'+x.resumo+'</div><div class=\'txt\'>'+x.texto+'</div><div class=\'ims\'><h4>'+imgLabel+'</h4>'+ih+'</div><div class=\'ac\'><button class=\'btn '+(x.apr?'apr':'')+'\' onclick=\'ta('+x.n+')\'>'+(x.apr?'✅ Aprovada':'Aprovar materia')+'</button></div></div>'}).join('')
atualizar()}
carregar();render();function f(cat){document.querySelectorAll('.filtro').forEach(x=>x.classList.remove('ativo'));event.target.classList.add('ativo');render()}
</script></body></html>
