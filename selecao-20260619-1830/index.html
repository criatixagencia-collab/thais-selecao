<script>
const p = [{"n":1,"cat":"famosos","cl":"Famosos","tit":"Nana Gouvea fala sobre affair com Romario e diz que se sentiu exposta","resumo":"Atriz confirmou relacionamento com ex-jogador, mas criticou exposicao publica do caso.","texto":"Nana Gouvea comentou publicamente os rumores e a repercussao envolvendo um suposto relacionamento com o ex-jogador de futebol Romario. Em entrevista a Quem, a atriz confirmou que viveu um affair recente com o ex-atacante, mas afirmou que se sentiu desconfortavel com a exposicao do caso, que ganhou forca apos registros dos dois juntos em Nova York.\n\nSegundo Nana, ela e Romario ja se conhecem ha muitos anos, mas nunca haviam tido qualquer envolvimento amoroso no passado. \"Eu conheco o Romario ha decadas, nunca tive nada com ele\", disse. No entanto, ao comentar o episodio mais recente, ela confirmou o relacionamento e relatou incomodo com a forma como a situacao veio a tona e se espalhou nas redes sociais.\n\nA atriz afirmou ainda que se sentiu exposta e desrespeitada com a repercussao. \"Me senti desrespeitada porque ele estava saindo comigo e outra pessoa ao mesmo tempo. E ele me expos\", declarou. O caso ganhou ainda mais atencao apos fotos e videos circularem mostrando encontros do ex-jogador em Nova York, onde ele esta acompanhando compromissos relacionados a Copa do Mundo 2026.\n\nMorando nos Estados Unidos ha alguns anos, Nana contou que nem sempre acompanha de imediato o que sai na imprensa brasileira. \"Minha vida esta tao em paz, estou tao bem, tao calma. Estou cuidando da minha familia\", afirmou. A atriz reforcou que o assunto afetou sua imagem: \"Acho que isso nao me acrescenta enquanto profissional. Me desmerece como mulher, mae de familia e profissional\".","imgs":[{"src":"imagens/01-romario-senado.jpg","label":"Romario - foto oficial no Senado","credito":"Agencia Senado / Wikimedia Commons","status":"segura"},{"src":"imagens/01-romario-2015.jpg","label":"Romario em 2015","credito":"Wikimedia Commons","status":"segura"},{"src":"imagens/01-romario-2022.jpg","label":"Romario em registro eleitoral de 2022","credito":"Wikimedia Commons","status":"usar com cautela"}]},{"n":2,"cat":"famosos","cl":"Famosos","tit":"Ex-Ronaldinha revela bastidores de namoro com Ronaldo Fenomeno e diz que segredo levou ao fim","resumo":"Vivi Brunieri contou em podcast que relacionamento terminou apos revelar verdade sobre sua origem.","texto":"Vivi Brunieri, conhecida como ex-Ronaldinha, abriu o jogo sobre o antigo relacionamento com o ex-jogador Ronaldo Nazario, o Ronaldo Fenomeno. Em entrevista ao podcast Na Mesa, ela relembrou o periodo em que os dois namoraram no inicio da carreira do atleta e contou detalhes intimos da relacao, alem de explicar como o romance chegou ao fim apos uma revelacao considerada decisiva.\n\nSegundo Vivi, o relacionamento comecou em meio ao auge da fama do jogador e a fase em que ela ainda escondia que trabalhava como garota de programa. Brunieri afirmou que, durante o namoro, mantinha uma narrativa diferente sobre sua origem financeira, o que acabou gerando tensao quando a verdade veio a tona.\n\n\"Eu, sufocada com aquilo, fiquei bebada. Ele tambem. E falei: Ronaldo, eu nao aguento mais. Eu nao tenho padrasto rico coisa nenhuma\", relembrou. A ex-Ronaldinha contou que a revelacao aconteceu em um momento de forte emocao entre os dois. \"Ele chorou muito, se sentiu muito traido. E ali terminou\", disse.\n\nAtualmente missionaria evangelica, Vivi afirma que revisita esse periodo da vida com outro olhar, reconhecendo os conflitos e excessos da epoca. Ela tambem mencionou episodios de vulnerabilidade pessoal e afirmou que a fase ficou marcada por escolhas dificeis e consequencias emocionais profundas.","imgs":[{"src":"imagens/02-ronaldo-2019.jpg","label":"Ronaldo Fenomeno em evento de tecnologia","credito":"Web Summit / Wikimedia Commons","status":"segura"},{"src":"imagens/02-ronaldo-2002.jpg","label":"Ronaldo Fenomeno na Copa de 2002","credito":"Wikimedia Commons","status":"usar com cautela"},{"src":"imagens/02-ronaldo-nazario.jpg","label":"Ronaldo Nazario - foto de arquivo","credito":"Wikimedia Commons","status":"segura"}]},{"n":3,"cat":"famosos","cl":"Famosos / Internacional","tit":"Anne Hathaway anuncia gravidez do terceiro filho","resumo":"Atriz vencedora do Oscar esta esperando mais um filho com o marido Adam Shulman.","texto":"A atriz Anne Hathaway, vencedora do Oscar de melhor atriz coadjuvante por \"Os Miseraveis\" (2013) e conhecida por papeis em \"O Diabo Veste Prada\" e \"Alice no Pais das Maravilhas\", surpreendeu os fas ao anunciar que esta esperando seu terceiro filho. A noticia foi revelada por meio de um video nas redes sociais.\n\nHathaway, de 43 anos, ja e mae de Jonathan (2016) e Jack (2019), ambos frutos do casamento com o produtor e ator Adam Shulman, com quem esta desde 2012. A atriz sempre foi reservada quanto a vida pessoal, mas frequentemente compartilha momentos em familia com os seguidores.\n\nA repercussao foi imediata: fas e celebridades enviaram mensagens de parabens, e a noticia rapidamente se espalhou pelos principais portais de entretenimento. A gravidez de Hathaway era um dos assuntos mais comentados do momento nas redes sociais, mostrando que a atriz continua sendo uma das figuras mais queridas de Hollywood.","imgs":[{"src":"imagens/03-anne-hathaway-2026.jpg","label":"Anne Hathaway em 2026","credito":"Wikimedia Commons","status":"segura"},{"src":"imagens/03-anne-hathaway.jpg","label":"Anne Hathaway em coletiva","credito":"Wikimedia Commons","status":"segura"},{"src":"imagens/01-anne-hathaway.jpg","label":"Anne Hathaway - arquivo","credito":"Wikimedia Commons","status":"segura"}]},{"n":4,"cat":"tv","cl":"TV / Famosos","tit":"Erro ao vivo sobre morte de Jorge Messi leva a demissoes e pedido de desculpas","resumo":"Apresentadora argentina anunciou ao vivo que o pai de Messi havia morrido. Emissora demitiu toda a equipe.","texto":"A apresentadora argentina Florencia Pena, do programa \"El Show del Verano\" exibido pela Luzu TV, cometeu um erro grave ao vivo ao anunciar que Jorge Messi, pai do astro Lionel Messi, havia morrido. A declaracao, feita em tom solene, foi imediatamente desmentida pela familia Messi, que informou que Jorge enfrenta problemas de saude mas esta em recuperacao hospitalar.\n\nA emissora nao hesitou em tomar medidas drasticas: toda a equipe responsavel pelo programa foi demitida. Florencia Pena, visivelmente abalada, pediu desculpas publicas e anunciou sua saida do canal. A Luzu TV emitiu uma nota oficial lamentando profundamente o incidente e reafirmando seu compromisso com o rigor jornalistico.\n\nO caso gerou ampla repercussao na Argentina e no mundo, especialmente por envolver a familia de Lionel Messi, um dos maiores nomes do esporte mundial. O erro ao vivo reacendeu o debate sobre a responsabilidade e a apuracao jornalistica em tempos de informacao instantanea.","imgs":[{"src":"imagens/04-lionel-messi-2025.jpg","label":"Lionel Messi em 2025","credito":"Wikimedia Commons","status":"segura"},{"src":"imagens/04-lionel-messi.jpg","label":"Lionel Messi na Casa Branca 2026","credito":"Wikimedia Commons / White House","status":"segura"},{"src":"imagens/02-lionel-messi.jpg","label":"Lionel Messi - arquivo","credito":"Wikimedia Commons","status":"segura"}]},{"n":5,"cat":"tv","cl":"TV Internacional","tit":"James Burrows, diretor de Taxi, Frasier e Will & Grace, morre","resumo":"Diretor premiado da televisao americana deixa legado de sucessos da comedia.","texto":"James Burrows, um dos diretores mais premiados e influentes da televisao americana, morreu. Burrows dirigiu marcos da TV como \"Taxi\", \"Frasier\" e \"Will & Grace\", sendo responsavel por alguns dos maiores sucessos da comedia televisiva dos anos 80, 90 e 2000.\n\nAo longo de sua carreira, Burrows acumulou diversos premios Emmy e foi amplamente reconhecido por seu trabalho em sitcoms que definiram geracoes. \"Taxi\" (1978-1983) foi um dos primeiros grandes sucessos, seguido por \"Frasier\" (1993-2004), que e considerada uma das melhores comedias da historia da TV.\n\n\"Will & Grace\" (1998-2006, 2017-2020) tambem levou sua assinatura e foi pioneira na representacao LGBTQIA+ na televisao aberta. James Burrows deixa um legado imensuravel para a comedia televisiva mundial.","imgs":[{"src":"imagens/05-james-burrows-ap.jpg","label":"James Burrows em premiere de Mid-Century Modern","credito":"AP Photo/Chris Pizzello","status":"usar com cautela"},{"src":"imagens/05-james-burrows-tvinsider.jpg","label":"James Burrows - retrato editorial","credito":"Jordan Strauss/Invision/AP/Shutterstock via TVInsider","status":"usar com cautela"}]},{"n":6,"cat":"musica","cl":"Musica","tit":"Tropa do Bruxo: disco com MC Tuto, MC Rodrigo do CN, MC Jacare e Hariel","resumo":"Iniciativa busca unir musica, futebol e o cotidiano das periferias brasileiras.","texto":"A iniciativa Tropa do Bruxo lancou um disco que busca unir musica, futebol e o cotidiano das periferias brasileiras. O album apresenta participacoes de artistas como MC Tuto, MC Rodrigo do CN, MC Jacare e Hariel, misturando funk e ritmos perifericos em uma proposta que celebra a cultura das comunidades.\n\nO projeto, que tem circulado nas plataformas de streaming, ja esta gerando repercusao entre os fas do genero. A uniao de varios nomes expressivos do funk atual em um mesmo trabalho e vista como um movimento de fortalecimento do genero e de valorizacao da cultura periferica.\n\nA Tropa do Bruxo se propoe a ser mais que um disco: e um conceito que conecta o universo do futebol de base com a musica feita nas quebradas, criando uma ponte entre duas das maiores expressoes culturais do Brasil.","imgs":[{"src":"imagens/06-tropa-bruxo-youtube-1.jpg","label":"Tropa do Bruxo - Tetel","credito":"Thumbnail oficial / YouTube","status":"usar com cautela"},{"src":"imagens/06-tropa-bruxo-youtube-2.jpg","label":"Tropa do Bruxo - Eterna","credito":"Thumbnail oficial / YouTube","status":"usar com cautela"},{"src":"imagens/06-ronaldinho-2019.jpg","label":"Ronaldinho Gaucho, associado ao projeto Tropa do Bruxo","credito":"Wikimedia Commons","status":"segura"}]},{"n":7,"cat":"musica","cl":"Musica","tit":"Rock in Rio Lisboa 2026 estreia com brasileiros Alok, Pedro Sampaio e Sepultura","resumo":"Ingressos do 1o fim de semana estao esgotados. Festival comeca neste sabado (20/6).","texto":"A 11a edicao do Rock in Rio Lisboa estreia neste sabado (20 de junho) no Parque Tejo, prometendo quatro dias de musica intensa. A programacao esta dividida nos dias 20, 21, 27 e 28 de junho, e os ingressos para o primeiro fim de semana ja estao completamente esgotados, sinal do enorme interesse do publico.\n\nO lineup internacional e de peso: Katy Perry, Linkin Park, Cypress Hill e Charlie Puth lideram os primeiros dias de festival. Mas o destaque especial fica por conta da forte presenca brasileira na programacao. Alok se apresenta no Palco Music Valley, Pedro Sampaio agita o Palco Mundo as 19h de sabado, e o Sepultura faz sua apresentacao no Palco Music Valley no domingo.\n\nO festival tambem contara com Matue, Filipe Ret e Dennis no segundo fim de semana, e tera uma Arena Musica e Futebol especialmente montada para a transmissao dos jogos da Copa do Mundo. Para os brasileiros que estao em Portugal, a programacao diversificada promete atender a todos os gostos.","imgs":[{"src":"imagens/07-rock-in-rio.jpg","label":"Rock in Rio - imagem de arquivo","credito":"Wikimedia Commons","status":"segura"},{"src":"imagens/16-rock-in-rio.jpg","label":"Rock in Rio - palco e publico","credito":"Wikimedia Commons","status":"segura"}]},{"n":8,"cat":"musica","cl":"Musica","tit":"Luan Santana e Wesley Safadao agitam o Sao Joao de Caruaru neste fim de semana","resumo":"Wesley Safadao (sexta), Matheus & Kauan (sabado) e Luan Santana (domingo) no Patio Luiz Gonzaga.","texto":"O Maior e Melhor Sao Joao do Mundo promete um fim de semana historico no Patio de Eventos Luiz Gonzaga, em Caruaru (PE). A festa comeca nesta sexta-feira (19) com Wesley Safadao subindo ao palco as 23h30, com transmissao ao vivo do jogo da Selecao Brasileira em telao.\n\nNo sabado (20), a dupla Matheus & Kauan encerra a noite de apresentacoes, enquanto o domingo (21) reserva a atracao mais esperada: Luan Santana, que se apresenta as 21h30, seguido por Henry Freitas. A programacao inclui ainda Taty Girl, Eric Land e diversas outras atracoes nos polos do Alto do Moura e do Aculao.\n\nO Sao Joao de Caruaru e tradicionalmente um dos maiores eventos juninos do Brasil, atraindo milhares de turistas de todo o pais todos os anos. A combinacao de grandes shows com a atmosfera tipica do Nordeste faz do Patio Luiz Gonzaga o lugar certo para quem quer celebrar o Sao Joao com musica de qualidade e cultura regional.","imgs":[{"src":"imagens/08a-luan-santana.jpg","label":"Luan Santana","credito":"Wikimedia Commons","status":"segura"},{"src":"imagens/08b-wesley-safadao.jpg","label":"Wesley Safadao","credito":"Wikimedia Commons","status":"segura"},{"src":"imagens/17-luan-santana.jpg","label":"Luan Santana - opcao alternativa","credito":"Wikimedia Commons","status":"segura"},{"src":"imagens/18-wesley-safadao.jpg","label":"Wesley Safadao - opcao alternativa","credito":"Wikimedia Commons","status":"segura"}]},{"n":9,"cat":"musica","cl":"Musica / Policia","tit":"MC Negao Original, foragido, e investigado por golpe de R$ 100 milhoes","resumo":"Foragido, funkeiro lancou musica no Top 20. Lei nao proibe lancamentos de artistas sob investigacao.","texto":"O funkeiro MC Negao Original, nome artistico de Joao Vitor Ribeiro, e alvo da Operacao Fim da Fabula, deflagrada pela Policia Civil de Sao Paulo em parceria com o Ministerio Publico. A operacao investiga uma organizacao criminosa especializada em golpes digitais — incluindo o \"golpe do falso advogado\" e golpe do INSS — que teria movimentado valores milionarios.\n\nA Justica determinou o bloqueio de ate R$ 100 milhoes em 86 contas bancarias ligadas ao esquema. MC Negao esta foragido e e suspeito de ceder apartamentos de sua propriedade para servirem de base para as operacoes criminosas. Apesar da situacao legal, o funkeiro lancou recentemente a musica \"Mini Saia\", que ja esta no Top 20 das plataformas de streaming.\n\nUm especialista ouvido pelo G1 explicou que a legislacao brasileira nao proibe o lancamento de musicas por artistas que estejam sob investigacao. \"O dever de encontrar o suspeito e do Estado, enquanto ele nao for condenado, preserva-se a presuncao de inocencia\", afirmou. O caso, que mescla musica e crime, tem gerado debates acalorados nas redes sociais.","imgs":[{"src":"imagens/09-mc-negao-mini-saia.jpg","label":"Mini Saia - lancamento com MC Negao Original","credito":"Thumbnail oficial / YouTube","status":"usar com cautela"},{"src":"imagens/09-mc-negao-visualizer.jpg","label":"Mini Saia - visualizer","credito":"Thumbnail oficial / YouTube","status":"usar com cautela"},{"src":"imagens/09-mc-negao-clipe.jpg","label":"MC Negao Original - videoclipe","credito":"Thumbnail oficial / YouTube","status":"usar com cautela"}]}];
function carregar(){const s=localStorage.getItem('thais_1830');if(s){const e=JSON.parse(s);p.forEach(x=>{if(e[x.n]){x.apr=e[x.n].a||false;x.im=e[x.n].i!==undefined?e[x.n].i:null}})}}
function sv(){const e={};p.forEach(x=>{e[x.n]={a:x.apr||false,i:x.im!==null?x.im:null}});localStorage.setItem('thais_1830',JSON.stringify(e));atualizar()}
function ta(n){const x=p.find(a=>a.n===n);x.apr=!x.apr;sv();render()}
function si(n,i){const x=p.find(a=>a.n===n);x.im=x.im===i?null:i;sv();render()}
function cp(n){navigator.clipboard.writeText(String(n));event.target.textContent='Copiado!';setTimeout(()=>event.target.textContent='Copiar',1500)}
function cr(){const a=p.filter(x=>x.apr);let t='Aprovadas:\n';a.forEach(x=>{t+='#'+x.n+' - '+x.tit+'\n';if(x.im!==null&&x.imgs[x.im])t+='  Img: '+x.imgs[x.im].label+'\n';t+='\n'});navigator.clipboard.writeText(t);event.target.textContent='Copiado!';setTimeout(()=>event.target.textContent='Copiar resumo',2000)}
function atualizar(){const t=p.length,a=p.filter(x=>x.apr).length;document.getElementById('resumoTopo').innerHTML='<span>'+t+'</span> pautas &middot; <span>'+a+'</span> aprov'+(a>0?' <button class="btn-cr" onclick="cr()">Copiar resumo</button>':'')}
function render(){const g=document.getElementById('grid');const cat=document.querySelector('.filtro.ativo')?.innerText?.toLowerCase()||'todas';const f=cat==='todas'?p:p.filter(x=>x.cat===cat)
g.innerHTML=f.map(x=>{const n=String(x.n).padStart(2,'0')
let ih=''
if(x.imgs.length===0){ih='<div class="pd">⚠️ Pendente de imagem alternativa</div>'}else{ih=x.imgs.map((img,i)=>{if(!img.src)return'<div class="pd">⚠️ '+img.label+' — '+img.credito+'</div>';const onerr="this.onerror=null;this.closest('.im').innerHTML='<div class=\'pd\'>⚠️ Img nao carregou</div>'";const sc=img.status.includes('segura')?'bg-s':img.status.includes('cautela')?'bg-c':'bg-p';return'<div class=\'im '+(x.im===i?'sel':'')+'\' onclick=\'si('+x.n+','+i+')\'><img src=\''+img.src+'\' alt=\''+img.label+'\' onerror=\''+onerr+'\'><div class=\'im-info\'><div class=\'lb\'>'+img.label+'</div><div class=\'cr\'>'+img.credito+'</div></div><span class=\'bd '+sc+'\'>'+img.status+'</span></div>'}).join('')}
return'<div class=\'card '+(x.apr?'aprov':'')+'\'><div class=\'ch\'><span class=\'num\'>#'+n+' <button class=\'btn-cp\' onclick=\'cp('+x.n+')\'>Copiar</button></span><span class=\'est '+(x.apr?'ea':'ep')+'\'>'+(x.apr?'✅ Aprov':'⏳ Pend')+'</span></div><div class=\'cat\'>'+x.cl+'</div><h3>'+x.tit+'</h3><div class=\'res\'>'+x.resumo+'</div><div class=\'txt\'>'+x.texto+'</div><div class=\'ims\'><h4>🖼️ Imagens</h4>'+ih+'</div><div class=\'ac\'><button class=\'btn '+(x.apr?'apr':'')+'\' onclick=\'ta('+x.n+')\'>'+(x.apr?'✅ Aprov':'Aprovar')+'</button></div></div>'}).join('')
atualizar()}
carregar();render();function f(cat){document.querySelectorAll('.filtro').forEach(x=>x.classList.remove('ativo'));event.target.classList.add('ativo');render()}
</script></body></html>
